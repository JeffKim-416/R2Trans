name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: swift test

      - name: Build unsigned universal DMG
        env:
          R2TRANS_ALLOW_ADHOC: '1'
          R2TRANS_REQUIRE_DISTRIBUTION: '0'
        run: Scripts/create_dmg.sh

      - name: Create checksum
        run: shasum -a 256 build/R2Trans.dmg > build/R2Trans.dmg.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "R2Trans $GITHUB_REF_NAME" \
            --generate-notes \
            build/R2Trans.dmg build/R2Trans.dmg.sha256
